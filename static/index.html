<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Overhead</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@500;700&family=EB+Garamond:ital@0;1&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
  <svg width="0" height="0" style="position:absolute" aria-hidden="true">
    <defs>
      <!-- Watercolour wash for the holding silhouettes -->
      <filter id="wash" x="-10%" y="-20%" width="120%" height="140%">
        <feTurbulence type="fractalNoise" baseFrequency="0.05" numOctaves="3" seed="7" result="n"/>
        <feDisplacementMap in="SourceGraphic" in2="n" scale="4" result="d"/>
        <feGaussianBlur in="d" stdDeviation="0.9"/>
      </filter>
      <linearGradient id="washTone" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0" stop-color="#b9c8d2" stop-opacity="0.55"/>
        <stop offset="1" stop-color="#7f95a3" stop-opacity="0.75"/>
      </linearGradient>
      <!-- Wobbly pencil line -->
      <filter id="wobble" x="-10%" y="-10%" width="120%" height="120%">
        <feTurbulence type="fractalNoise" baseFrequency="0.06" numOctaves="2" seed="9" result="n"/>
        <feDisplacementMap in="SourceGraphic" in2="n" scale="2"/>
      </filter>
      <!-- Slight wobble so ruled lines look hand drawn -->
      <filter id="pencil" x="-2%" y="-50%" width="104%" height="200%">
        <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3" result="n"/>
        <feDisplacementMap in="SourceGraphic" in2="n" scale="3"/>
      </filter>
    </defs>
  </svg>

  <header>
    <h1 id="place">Overhead</h1>
    <p id="summary">Listening to the sky…</p>
    <svg class="underline" viewBox="0 0 1000 10" preserveAspectRatio="none" aria-hidden="true">
      <path d="M2,6 C200,3 420,8 640,5 S900,4 998,6" filter="url(#pencil)"/>
    </svg>
  </header>

  <main id="page"></main>

  <footer>
    <span>Spotted with my own ADS-B receiver · photographs credited individually, via planespotters.net · painted locally</span>
    <span id="updated"></span>
  </footer>

  <script src="/static/app.js"></script>
</body>
</html>
